<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — Панель управления</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4f6fb;
            color: #1f2733;
            padding: 20px;
        }
        .login-card {
            background: #fff;
            border: 1px solid #e4e8f0;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(30, 45, 90, .08);
            padding: 34px 30px;
            width: 100%;
            max-width: 380px;
        }
        h1 { font-size: 22px; margin: 0 0 4px; }
        .sub { color: #6b7688; font-size: 14px; margin: 0 0 24px; }
        label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
        .field { margin-bottom: 18px; }
        input[type="text"], input[type="password"] {
            width: 100%;
            border: 1px solid #e4e8f0;
            border-radius: 10px;
            padding: 12px 14px;
            font: inherit;
            background: #fbfcfe;
        }
        input:focus { outline: none; border-color: #3b6cf6; background: #fff; }
        .btn {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font: inherit;
            font-weight: 600;
            color: #fff;
            background: #3b6cf6;
            cursor: pointer;
        }
        .btn:hover { background: #2f57cc; }
        .errors {
            background: #fdeceb;
            border: 1px solid #f6c9c4;
            color: #b93a30;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            margin-bottom: 18px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>📋 Панель управления</h1>
        <p class="sub">Войдите, чтобы редактировать программы.</p>

        {% if form.errors %}
            <div class="errors">Неверный логин или пароль. Попробуйте ещё раз.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="field">
                <label for="{{ form.username.id_for_label }}">Логин</label>
                <input type="text" name="{{ form.username.html_name }}"
                       id="{{ form.username.id_for_label }}" autofocus required>
            </div>
            <div class="field">
                <label for="{{ form.password.id_for_label }}">Пароль</label>
                <input type="password" name="{{ form.password.html_name }}"
                       id="{{ form.password.id_for_label }}" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn">Войти</button>
        </form>
    </div>
</body>
</html>
