{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Панель управления{% endblock %}</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --ink: #1f2733;
            --muted: #6b7688;
            --line: #e4e8f0;
            --brand: #3b6cf6;
            --brand-dark: #2f57cc;
            --danger: #e2574c;
            --ok: #2e9e6b;
            --radius: 14px;
            --shadow: 0 4px 20px rgba(30, 45, 90, .07);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        a { color: var(--brand); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .topbar {
            background: var(--card);
            border-bottom: 1px solid var(--line);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .topbar .wrap { display: flex; align-items: center; justify-content: space-between; }
        .brand { font-size: 18px; font-weight: 700; color: var(--ink); }
        .brand:hover { text-decoration: none; }
        .topbar .logout { font-size: 14px; color: var(--muted); }

        .wrap { max-width: 860px; margin: 0 auto; padding: 0 20px; }
        main.wrap { padding-top: 28px; padding-bottom: 60px; }

        .crumbs { font-size: 14px; color: var(--muted); margin-bottom: 18px; }
        .crumbs a { color: var(--muted); }
        .crumbs span { margin: 0 6px; }

        h1 { font-size: 26px; margin: 0 0 6px; }
        h2 { font-size: 18px; margin: 0 0 14px; }
        .lead { color: var(--muted); margin: 0 0 26px; }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 20px;
        }

        .field { margin-bottom: 24px; }
        .field:last-child { margin-bottom: 0; }
        .field > label {
            display: block;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 8px;
        }
        .field .hint { color: var(--muted); font-size: 13px; margin: -4px 0 10px; }

        textarea, input[type="text"] {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px 14px;
            font: inherit;
            color: var(--ink);
            background: #fbfcfe;
            resize: vertical;
        }
        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--brand);
            background: #fff;
        }

        .current-file {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f0f4ff;
            border: 1px solid #dbe4ff;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .current-file .none { color: var(--muted); }

        /* --- Предпросмотр файлов --- */
        .preview-box { margin-bottom: 12px; }
        .preview-img {
            display: block;
            max-width: 260px;
            max-height: 220px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: #fff;
        }
        .preview-pdf {
            display: block;
            width: 100%;
            max-width: 420px;
            height: 320px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
        }
        .preview-file {
            display: inline-block;
            background: #f0f4ff;
            border: 1px solid #dbe4ff;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
        }
        .preview-open { display: inline-block; margin-top: 8px; font-size: 13px; }

        /* --- Кнопка выбора файла --- */
        .file-picker { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
        .file-name { color: var(--muted); font-size: 14px; word-break: break-all; }
        .visually-hidden {
            position: absolute !important;
            width: 1px; height: 1px;
            padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0 0 0 0);
            white-space: nowrap; border: 0;
        }
        input[type="file"] { font: inherit; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            border-radius: 10px;
            padding: 12px 22px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            background: var(--brand);
            color: #fff;
            transition: background .15s;
        }
        .btn:hover { background: var(--brand-dark); text-decoration: none; }
        .btn.secondary { background: #eef1f7; color: var(--ink); }
        .btn.secondary:hover { background: #e2e7f0; }
        .btn.ghost { background: transparent; color: var(--brand); padding: 10px 12px; }

        .actions { margin-top: 8px; display: flex; gap: 12px; align-items: center; }

        .row-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px;
            border: 1px solid var(--line);
            border-radius: 12px;
            margin-bottom: 10px;
            background: #fff;
            transition: border-color .15s, box-shadow .15s;
        }
        .row-link:hover { border-color: var(--brand); box-shadow: var(--shadow); text-decoration: none; }
        .row-link .main { font-weight: 600; color: var(--ink); }
        .row-link .sub { color: var(--muted); font-size: 13px; }
        .row-link .chevron { color: var(--muted); font-size: 20px; }

        .errors { color: var(--danger); font-size: 14px; margin-top: 6px; }
        .empty { color: var(--muted); font-style: italic; padding: 10px 0; }

        .divider { height: 1px; background: var(--line); margin: 28px 0; border: 0; }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body>
    <div class="topbar">
        <div class="wrap">
            <a class="brand" href="{% url 'panel:list' %}">📋 Панель управления</a>
            <form action="{% url 'panel:logout' %}" method="post" style="margin:0">
                {% csrf_token %}
                <button type="submit" class="logout" style="background:none;border:none;cursor:pointer;font:inherit">Выйти</button>
            </form>
        </div>
    </div>
    <main class="wrap">
        {% block content %}{% endblock %}
    </main>
    <script>
    // Заменяет стандартный файловый инпут на кнопку «Выбрать новый»
    // с именем файла и живым предпросмотром картинок.
    window.enhanceFilePickers = function (root) {
        (root || document).querySelectorAll('input[type="file"]').forEach(function (input) {
            if (input.dataset.enhanced) return;
            input.dataset.enhanced = '1';

            var picker = document.createElement('div');
            picker.className = 'file-picker';
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn secondary';
            btn.textContent = 'Выбрать новый';
            var name = document.createElement('span');
            name.className = 'file-name';
            name.textContent = 'файл не выбран';

            input.parentNode.insertBefore(picker, input);
            input.classList.add('visually-hidden');
            picker.appendChild(btn);
            picker.appendChild(name);
            picker.appendChild(input);

            btn.addEventListener('click', function () { input.click(); });

            input.addEventListener('change', function () {
                var f = input.files && input.files[0];
                if (!f) { name.textContent = 'файл не выбран'; return; }
                name.textContent = f.name;
                if (f.type && f.type.indexOf('image/') === 0) {
                    var reader = new FileReader();
                    reader.onload = function (e) {
                        var box = input.closest('.field, .body');
                        if (!box) return;
                        var img = box.querySelector('.preview-img.live');
                        if (!img) {
                            img = document.createElement('img');
                            img.className = 'preview-img live';
                            var oldBox = box.querySelector('.preview-box');
                            if (oldBox) oldBox.replaceWith(img);
                            else box.insertBefore(img, picker);
                        }
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(f);
                }
            });
        });
    };
    document.addEventListener('DOMContentLoaded', function () { window.enhanceFilePickers(document); });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
